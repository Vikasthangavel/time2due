<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Time2Cable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#0d9488',
                        'primary-dark': '#0c8276',
                        'secondary': '#1e3a8a',
                        'accent': '#f59e0b',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateX(100%)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                    },
                },
            },
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .popup-notification {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            min-width: 250px;
            max-width: 350px;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slide-in 0.3s ease-out;
        }
        .popup-close {
            cursor: pointer;
            font-size: 1rem;
            color: white;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md animate-fade-in">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Change Password</h2>
        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="mb-4">
                <label for="current_password" class="block text-sm font-medium text-gray-700">Current Password</label>
                <input type="password" id="current_password" name="current_password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary" required>
            </div>
            <div class="mb-4">
                <label for="new_password" class="block text-sm font-medium text-gray-700">New Password</label>
                <input type="password" id="new_password" name="new_password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary" required>
            </div>
            <div class="mb-6">
                <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary" required>
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-2 px-4 rounded-lg transition duration-300 transform hover:scale-105">Change Password</button>
        </form>
        <div class="mt-4 text-center">
            <a href="{{ url_for('user_dashboard') }}" class="text-primary hover:underline">Back to Dashboard</a>
        </div>
    </div>

    <script>
        function showPopupNotification(message, category) {
            const popupContainer = document.createElement('div');
            popupContainer.className = `popup-notification ${
                category === 'success' ? 'bg-green-600' : 'bg-red-600'
            } text-white`;
            popupContainer.innerHTML = `
                <span class="text-sm">${message}</span>
                <span class="popup-close" onclick="this.parentElement.remove()">×</span>
            `;
            document.body.appendChild(popupContainer);
            setTimeout(() => popupContainer.remove(), 3000);
        }

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    showPopupNotification("{{ message | safe }}", "{{ category }}");
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
</body>
</html>
